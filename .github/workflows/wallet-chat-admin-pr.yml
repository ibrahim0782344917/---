name: Shitreed Wallet Chat Admin PR Checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'merchant_app/lib/**'
      - 'test/**'
      - 'merchant_app/test/**'
      - 'supabase/migrations/**'
      - '.github/workflows/wallet-chat-admin-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: merchant_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  migration_static_gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical security design stays intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('supabase/migrations/20261122133000_wallet_chat_admin_foundation.sql').read_text()
          required = [
              'schema if not exists shitreed_finance',
              'UNBALANCED_FINANCIAL_JOURNAL',
              'FINANCIAL_LEDGER_IMMUTABLE',
              'revoke all on all tables in schema shitreed_finance',
              'shitreed_wallet_overview',
              'shitreed_wallet_activity',
              'shitreed_chat_send',
              'CHAT_NOT_AUTHORIZED',
              'shitreed_is_admin()',
              'enable row level security',
              'merchant_id uuid not null',
          ]
          for value in required:
              assert value in sql, f'Missing safety boundary: {value}'
          for f in ['lib/finance/customer_wallet_page.dart',
                    'merchant_app/lib/finance/merchant_finance_pages.dart']:
              source = Path(f).read_text()
              assert 'service_role' not in source, f'Forbidden secret reference: {f}'
          print('Static security guards present. Live SQL/RLS tests still required.')
          PY


  isolated_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create local fixture schema
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/wallet_chat_bootstrap.sql
      - name: Apply safe additive migration against isolated database
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261122133000_wallet_chat_admin_foundation.sql
      - name: Verify accounting and customer-merchant privacy
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/wallet_chat_assertions.sql
      - name: Reject unbalanced journal at COMMIT
        shell: bash
        run: |
          set +e
          OUTPUT=$(psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          begin;
          insert into shitreed_finance.journals(currency,reference_key,description)
          values('IQD','fixture_unbalanced_2','Unbalanced test entry')
          returning id;
          insert into shitreed_finance.entries(journal_id,account_id,currency,delta)
          select j.id,'30000000-0000-4000-8000-000000000001','IQD',500
          from shitreed_finance.journals j
          where j.reference_key='fixture_unbalanced_2';
          commit;
          SQL
          )
          RESULT=$?
          set -e
          if [ "$RESULT" -eq 0 ]; then
            echo "ERROR: unbalanced journal accepted"
            exit 1
          fi
          if ! printf '%s' "$OUTPUT" | grep -q 'UNBALANCED_FINANCIAL_JOURNAL'; then
            echo "ERROR: rejected for an unexpected reason"
            printf '%s\n' "$OUTPUT"
            exit 1
          fi
          echo "Correctly rejected an unbalanced journal"
