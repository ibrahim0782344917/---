name: Al-Ani master TEST customer and merchant QA (no deployment)
on:
  push:
    branches: [work/alani-10000-master-test-20261125]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'merchant_app/**'
      - '.github/workflows/alani-master-test-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-qa:
    if: github.ref == 'refs/heads/work/alani-10000-master-test-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'merchant_app']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
