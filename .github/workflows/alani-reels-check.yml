name: Al-Ani Reels - gallery APK and storage authorization

on:
  push:
    branches:
      - feature/alani-gallery-reels-live-20261122
      - feature/alani-final-release-content-20261122
  pull_request:
    paths:
      - 'lib/alani/**'
      - 'test/alani_shop_test.dart'
      - 'docs/ALANI_REELS_STORAGE_ACTIVATION_20261122.sql'
      - 'tests/alani_reels_*.sql'
      - '.github/workflows/alani-reels-check.yml'

permissions:
  contents: read

jobs:
  storage-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test Supabase-style RLS without production connection
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name alani-reels-db \
            -e POSTGRES_PASSWORD=test-only -e POSTGRES_DB=alani_reels_test \
            postgres:17-alpine >/dev/null
          trap 'docker rm -f alani-reels-db >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if docker logs alani-reels-db 2>&1 | grep -q \
              'PostgreSQL init process complete; ready for start up' &&
              docker exec alani-reels-db \
                psql -X -qAt -U postgres -d alani_reels_test \
                -c 'select 1' 2>/dev/null | grep -qx 1; then
              break
            fi
            sleep 1
          done
          cat tests/alani_reels_storage_fixture.sql \
            docs/ALANI_REELS_STORAGE_ACTIVATION_20261122.sql \
            tests/alani_reels_storage_checks.sql |
            docker exec -i alani-reels-db \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d alani_reels_test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android wrapper
        run: flutter create --org com.ibrahimalani --project-name shitreed_customer --platforms android .
      - name: Prepare network and Maps permissions
        run: |
          python3 scripts/configure_android_maps.py
          python3 merchant_app/scripts/use_runner_ndk.py
      - name: Apply branded icon
        run: python3 scripts/configure_alani_icon.py . customer
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test test/alani_shop_test.dart
      - name: Build real-network debug APK (not signed for Play)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://ltwncrewggdrjevakwpb.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Tao4VcnXR93Ne9KUBJ76tg_o-Pmd75_ \
            --dart-define=ALANI_STORE_ID=25091ca2-c0da-416c-b634-81b188ee66be
      - uses: actions/upload-artifact@v4
        with:
          name: AlAni-Gallery-Reels-Android-TEST-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
