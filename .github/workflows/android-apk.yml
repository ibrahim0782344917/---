name: Shitreed Customer Connected APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android
        run: flutter create --org com.shitreed --project-name shitreed_customer --platforms android .
      - name: Configure Android maps and location permissions
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python3 scripts/configure_android_maps.py
      - name: Packages
        run: flutter pub get
      - name: Analyze customer app only
        run: flutter analyze lib test
      - name: Tests
        run: flutter test
      - name: Build Android debug
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          MAPS_ENABLED=false
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then MAPS_ENABLED=true; fi
          flutter build apk --debug \
            --dart-define=GOOGLE_MAPS_ENABLED=$MAPS_ENABLED \
            --dart-define=SUPABASE_URL=https://ltwncrewggdrjevakwpb.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_Tao4VcnXR93Ne9KUBJ76tg_o-Pmd75_
      - name: Verify Google Maps key and Android signing fingerprint
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          echo "### Shitreed Google Maps diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Android package: com.shitreed.shitreed_customer" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Maps API key secret: PRESENT (value not logged)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Maps API key secret: MISSING (fallback external maps only)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$HOME/.android/debug.keystore" ]; then
            FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              | sed -n 's/^[[:space:]]*SHA1: //p' | head -n1)
            echo "Android debug signing SHA-1: $FINGERPRINT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No ephemeral debug keystore found." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Shitreed-Customer-Connected-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
