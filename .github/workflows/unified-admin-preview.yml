name: Unified Shitreed Admin and Al-Ani Android Preview
on:
  push:
    branches:
      - feature/alani-unified-admin-20261118
    paths:
      - 'admin_app/**'
      - '.github/workflows/unified-admin-preview.yml'
  pull_request:
    paths:
      - 'admin_app/**'
      - '.github/workflows/unified-admin-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-admin:
    name: One Admin App - Verify and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: admin_app
    env:
      SUPABASE_URL: https://ltwncrewggdrjevakwpb.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_Tao4VcnXR93Ne9KUBJ76tg_o-Pmd75_
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate one Admin Android package
        run: flutter create --org com.shitreed --project-name shitreed_admin --platforms android .
      - name: Require network access and remove starter test
        run: |
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          text=manifest.read_text()
          if "android.permission.INTERNET" not in text:
              text=text.replace("<application",
                '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          text=text.replace('android:label="shitreed_admin"',
              'android:label="إدارة شتريد والعاني"')
          manifest.write_text(text)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
      - name: Build Unified Admin preview
        run: |
          flutter build apk --debug \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=ALANI_API_BASE=https://alani-site-admin-staging.up.railway.app
      - uses: actions/upload-artifact@v4
        with:
          name: Unified-Shitreed-AlAni-Admin-PREVIEW-APK
          path: admin_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
