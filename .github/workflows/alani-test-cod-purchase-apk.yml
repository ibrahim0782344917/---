name: Al-Ani COD - isolated test purchase APK (never deploy)
on:
  push:
    branches: [work/alani-test-cod-purchase-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-staging-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_SUPABASE_URL: https://tgvdwotbrnhcoykuxdpr.supabase.co
      TEST_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LUUtkKZWm3cqIRLQSLM4iQ_puh2ipiY
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android test project
        run: flutter create --org com.ibrahimalani --project-name shitreed_customer --platforms android .
      - name: Disable paid Maps use and apply official Al-Ani icon
        run: |
          python3 scripts/configure_android_maps.py
          python3 scripts/configure_alani_icon.py . customer
          python3 merchant_app/scripts/use_runner_ndk.py
      - name: Analyze and run tests (normal default checkout remains locked)
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test
      - name: Build only test-database COD preview (never production)
        run: |
          test "$TEST_SUPABASE_URL" = "https://tgvdwotbrnhcoykuxdpr.supabase.co"
          [[ "$TEST_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          flutter build apk --debug \
            --dart-define="SUPABASE_URL=$TEST_SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$TEST_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="ALANI_STORE_ID=25091ca2-c0da-416c-b634-81b188ee66be" \
            --dart-define="ALANI_TEST_CHECKOUT_ENABLED=true" \
            --dart-define="ALANI_CHECKOUT_ENABLED=false" \
            --dart-define="ALANI_DELIVERY_TOTALS_VERIFIED=false" \
            --dart-define="GOOGLE_MAPS_ENABLED=false" \
            --dart-define="SHITREED_CAMPAIGNS_ENABLED=false"
      - name: Confirm the debug APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlAni-Customer-COD-Test-Only-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
