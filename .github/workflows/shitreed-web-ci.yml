name: Shitreed Web Security Checks
on:
  push:
    branches:
      - feature/shitreed-website-20261114
    paths:
      - 'web/**'
      - '.github/workflows/shitreed-web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/shitreed-web-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check server and browser syntax
        run: npm run check
      - name: Test API routing and security guards
        run: npm test
