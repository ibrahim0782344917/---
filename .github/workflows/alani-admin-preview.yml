name: Al Ani Admin App Android Preview
on:
  push:
    branches:
      - feature/alani-herbal-store-app-20261118
    paths:
      - 'alani_admin_app/**'
      - '.github/workflows/alani-admin-preview.yml'
  pull_request:
    paths:
      - 'alani_admin_app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: alani_admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Android project
        run: flutter create --org com.ibrahimalani --project-name alani_admin_app --platforms android .
      - name: Require HTTPS networking for admin APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          source=p.read_text()
          if 'android.permission.INTERNET' not in source:
              source=source.replace('<application',
                '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          p.write_text(source)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
      - name: Build Android debug preview
        run: |
          flutter build apk --debug \
            --dart-define=ALANI_API_BASE=https://alani-site-admin-staging.up.railway.app
      - uses: actions/upload-artifact@v4
        with:
          name: AlAni-Admin-Android-PREVIEW
          path: alani_admin_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
